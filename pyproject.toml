[project]
name = "automationexercise-playwright-python-framework"
version = "0.1.0"
description = "UI and API test automation framework for automationexercise.com, built with Playwright and Pytest."
# 3.11, not 3.10: api/api_client.py uses enum.StrEnum, which landed in 3.11.
# This said 3.10, so pip installed happily and the first import failed.
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.16.0",
    "allure-python-commons>=2.16.0",
    "faker>=40.36.0",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "playwright>=1.61.0",
    "pytest>=8.2",
    "pytest-html>=4.2.0",
    "pytest-rerunfailures>=15.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.2",
]
