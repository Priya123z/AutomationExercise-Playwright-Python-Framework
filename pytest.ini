[pytest]

testpaths = tests

python_files = test_*.py
python_functions = test_*
python_classes = Test*

addopts =
    -v
    --self-contained-html
    --strict-markers

markers =
    ui: tests that drive a browser
    api: tests that call an API directly
    smoke: the critical path, run on every commit
    auth: login, registration and account deletion
    cart: cart and quantity behaviour
    checkout: checkout and payment
    products: product search, listing and detail
    negative: expects a failure response
