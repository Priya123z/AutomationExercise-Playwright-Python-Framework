name: Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: UI and API suite
    runs-on: ubuntu-latest

    env:
      # The framework names its artifacts folder after this, so the workflow knows the
      # path up front instead of searching for it afterwards.
      TEST_EXECUTION_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
      BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com/' }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://automationexercise.com/api' }}
      DUMMYJSON_API_BASE_URL: ${{ vars.DUMMYJSON_API_BASE_URL || 'https://dummyjson.com' }}
      HEADLESS: "true"
      BROWSER: "chromium"
      DEFAULT_TIMEOUT: "10000"
      EXPECT_TIMEOUT: "20000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: automationexercise-tests:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p artifacts
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e TEST_EXECUTION_ID \
            -e BASE_URL -e API_BASE_URL -e DUMMYJSON_API_BASE_URL \
            -e HEADLESS -e BROWSER -e DEFAULT_TIMEOUT -e EXPECT_TIMEOUT \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            automationexercise-tests:${{ github.sha }} \
            pytest -n 2 -q -p no:cacheprovider \
              --junitxml=/app/artifacts/${TEST_EXECUTION_ID}/junit.xml \
            | tee pytest.log
          exit "${PIPESTATUS[0]}"

      - name: Summarise results
        if: always()
        id: summary
        run: |
          python3 .github/scripts/summarise_results.py \
            "artifacts/${TEST_EXECUTION_ID}/junit.xml" summary.md pytest.log

      - name: Restore Allure history
        if: always()
        continue-on-error: true
        run: |
          # Trends only exist if the previous report's history folder is carried forward.
          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages 2>/dev/null || exit 0

          SOURCE="gh-pages/history"
          if [ -n "${{ github.event.number }}" ]; then
            SOURCE="gh-pages/pr-${{ github.event.number }}/history"
            [ -d "$SOURCE" ] || SOURCE="gh-pages/history"
          fi

          if [ -d "$SOURCE" ]; then
            cp -r "$SOURCE" "artifacts/${TEST_EXECUTION_ID}/allure-results/history"
            echo "Carried forward $(ls "$SOURCE" | wc -l) history files"
          fi

      - name: Generate Allure report
        if: always()
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}
        run: |
          # Lets the published report link back to the run that produced it.
          cat > "artifacts/${TEST_EXECUTION_ID}/allure-results/executor.json" <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "${REPORT_URL}"
          }
          JSON

          npm install -g allure-commandline --silent
          allure generate "artifacts/${TEST_EXECUTION_ID}/allure-results" \
            -o "artifacts/${TEST_EXECUTION_ID}/allure-report" --clean

      - name: Publish report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: artifacts/${{ env.TEST_EXECUTION_ID }}/allure-report
          destination_dir: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '.' }}
          keep_files: true
          user_name: Priya Bhagoriya
          user_email: prbhagoriya20@gmail.com
          commit_message: "Publish report for ${{ github.sha }}"

      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8')
              + `\n\n[Open the full Allure report](${process.env.REPORT_URL})\n`
              + '\n<!-- automation-test-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('<!-- automation-test-report -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/
          retention-days: 14

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
