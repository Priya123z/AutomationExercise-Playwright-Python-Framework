name: Playwright Automation Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Automation Tests in Docker
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      DUMMYJSON_API_BASE_URL: ${{ vars.DUMMYJSON_API_BASE_URL }}
      HEADLESS: "true"
      BROWSER: "chromium"
      DEFAULT_TIMEOUT: "10000"
      EXPECT_TIMEOUT: "20000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t automationexercise-tests .

      - name: Run tests in Docker
        run: |
          docker run --rm \
            -e BASE_URL="${BASE_URL}" \
            -e API_BASE_URL="${API_BASE_URL}" \
            -e DUMMYJSON_API_BASE_URL="${DUMMYJSON_API_BASE_URL}" \
            -e HEADLESS="${HEADLESS}" \
            -e BROWSER="${BROWSER}" \
            -e DEFAULT_TIMEOUT="${DEFAULT_TIMEOUT}" \
            -e EXPECT_TIMEOUT="${EXPECT_TIMEOUT}" \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            automationexercise-tests \
            pytest -n 2 -q

      - name: Fix artifact permissions
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" artifacts

      - name: Verify artifact ownership
        if: always()
        run: |
          echo "===== Artifact Permissions ====="
          find artifacts -maxdepth 2 -type d -exec ls -ld {} \;

      - name: Show generated artifacts
        if: always()
        run: |
          echo "===== Artifact Directory ====="
          find artifacts -maxdepth 4 -type f | sort

      - name: Install Allure
        if: always()
        run: |
          npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: |
          ALLURE_RESULTS_DIR=$(find artifacts -type d -name "allure-results" -print -quit)

          if [ -z "$ALLURE_RESULTS_DIR" ]; then
            echo "ERROR: Allure results directory not found"
            exit 1
          fi

          echo "Allure results found at: $ALLURE_RESULTS_DIR"

          ALLURE_REPORT_DIR="$(dirname "$ALLURE_RESULTS_DIR")/allure-report"

          echo "Generating Allure report at: $ALLURE_REPORT_DIR"

          allure generate "$ALLURE_RESULTS_DIR" \
            -o "$ALLURE_REPORT_DIR" \
            --clean

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: artifacts/

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: artifacts/*/allure-report/